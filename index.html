<body>
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob-1"></span><span class="blob blob-2"></span><span class="blob blob-3"></span>

  <header class="topbar">
    <a class="brand" href="#top" aria-label="Sahapat Jundum"><span class="brand-mark">SJ</span><span class="brand-text">Sahapat Jundum</span></a>

  <!-- first-visit hint -->

  <div class="mascot" id="mascot" aria-hidden="true">
    <svg viewBox="0 0 120 140" width="120" height="140">
      <g class="m-body">
        <ellipse cx="60" cy="128" rx="30" ry="6" fill="rgba(30,42,36,.12)"/>

        <rect x="42" y="84" width="36" height="26" rx="4" fill="#fff" stroke="#1E2A24" stroke-width="3" class="m-paper"/>
        <line x1="48" y1="92" x2="72" y2="92" stroke="#1E2A24" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="48" y1="99" x2="66" y2="99" stroke="#1E2A24" stroke-width="2.5" stroke-linecap="round"/>

        <path d="M32 40 Q40 12 62 14 Q86 12 90 40 Q78 30 60 32 Q44 34 32 40Z" fill="#1E2A24"/>

          <circle cx="49" cy="46" r="3.2" fill="#1E2A24"/>
          <circle cx="71" cy="46" r="3.2" fill="#1E2A24"/>
        </g>
        <path class="m-mouth" d="M52 58 Q60 64 68 58" fill="none" stroke="#1E2A24" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="42" cy="54" r="3.5" fill="#F7A6A0" opacity=".8"/>
        <circle cx="78" cy="54" r="3.5" fill="#F7A6A0" opacity=".8"/>
      </g>
      <g class="m-spark" fill="#F2B134" stroke="#1E2A24" stroke-width="2">
        <path d="M104 22 l4 8 8 4 -8 4 -4 8 -4 -8 -8 -4 8 -4z"/>
      </g>
    </svg>
  </div>

  <!-- popup / bottom sheet -->
  <div class="popup-backdrop" id="popupBackdrop" hidden></div>
  <section class="popup" id="popup" role="dialog" aria-modal="true" aria-hidden="true" hidden>
    <div class="popup-grab" aria-hidden="true"></div>
    <header class="popup-head">
      <div class="popup-titles">
        <p class="popup-tag" id="popupTag"></p>
        <h2 class="popup-title" id="popupTitle"></h2>
      </div>
      <button class="popup-close" id="popupClose" type="button" aria-label="Close">✕</button>
    </header>
    <div class="popup-body" id="popupBody"></div>
  </section>

  <script src="js/app.js?v=2026-11-11d" type="module"></script>
